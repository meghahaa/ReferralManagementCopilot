[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "referral-management-copilot"
version = "1.0.0"
description = "Multi-Agent Healthcare Referral Copilot on LangGraph with custom MCP, Tiered Memory, Context Engineering, and Agentic RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "langgraph==1.2.11",
    "langchain-core==1.6.2",
    "mcp==1.29.1",
    "langchain-mcp-adapters==0.3.2",
    "python-dotenv==1.2.3",
    "langchain-google-genai==4.3.7",
    "langchain-groq==1.1.3",
    "pytest==9.1.1",
    "streamlit==1.62.0"
]

[tool.setuptools.packages.find]
where = ["src"]
